name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"
      - name: Restore release signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.jks"
      - name: Test, lint, and build
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/signing/release.jks
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
      - name: Create release files
        env:
          VERSION: "0.6.0"
        run: |
          mkdir -p release-dist
          apk="release-dist/LiveTranslate-v${VERSION}-arm64-v8a.apk"
          metadata="release-dist/LiveTranslate-v${VERSION}-metadata.json"
          latest_apk="release-dist/LiveTranslate-latest-arm64-v8a.apk"
          latest_metadata="release-dist/LiveTranslate-latest-metadata.json"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          cp "$apk" "$latest_apk"
          sha256="$(sha256sum "$apk" | cut -d' ' -f1)"
          size="$(stat -c '%s' "$apk")"
          jq -n \
            --arg version "$VERSION" \
            --arg sha256 "$sha256" \
            --argjson size "$size" \
            --arg commit "$GITHUB_SHA" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            '{
              schemaVersion: 1,
              app: "Live Translate",
              packageName: "com.jadenjsj.livetranslate",
              versionName: $version,
              versionCode: 10,
              channel: "prerelease",
              releaseTag: ("v" + $version),
              buildType: "release",
              minSdk: 26,
              targetSdk: 36,
              compileSdk: 36,
              supportedAbis: ["arm64-v8a"],
              supportedCpuFamilies: ["Armv8-A", "Armv9-A"],
              signingCertificateSha256: "9490968e5b1b76341dbfda5ff5f8d591d1ebbb427c10f69612cfa5285390e4de",
              apkSha256: $sha256,
              apkSizeBytes: $size,
              sourceCommit: $commit,
              buildRun: $run,
              releasePage: ($repository + "/releases/tag/v" + $version),
              apkUrl: ($repository + "/releases/download/v" + $version + "/LiveTranslate-v" + $version + "-arm64-v8a.apk"),
              latestMetadataUrl: ($repository + "/releases/download/latest-prerelease/LiveTranslate-latest-metadata.json"),
              latestApkUrl: ($repository + "/releases/download/latest-prerelease/LiveTranslate-latest-arm64-v8a.apk"),
              model: "qwen3.5-livetranslate-flash-realtime",
              notes: "Pre-release. Material 3 color-role audit for accessible light/dark contrast, official Material Symbols, and stable rolling update URLs."
            }' > "$metadata"
          cp "$metadata" "$latest_metadata"
      - uses: actions/upload-artifact@v4
        with:
          name: LiveTranslate-v0.6.0-arm64-v8a
          path: release-dist/
          if-no-files-found: error
          retention-days: 14
      - name: Publish stable latest-prerelease URLs
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view latest-prerelease >/dev/null 2>&1; then
            gh release create latest-prerelease \
              --target "$GITHUB_SHA" \
              --title "Live Translate · latest prerelease" \
              --prerelease \
              --notes "Rolling prerelease assets for update clients. Read LiveTranslate-latest-metadata.json before downloading the APK."
          fi
          gh release upload latest-prerelease \
            release-dist/LiveTranslate-latest-metadata.json \
            release-dist/LiveTranslate-latest-arm64-v8a.apk \
            --clobber
